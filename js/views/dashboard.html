<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GlowDiary - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar Menú -->
        <aside class="sidebar">
            <h2 class="logo">GlowDiary ✨</h2>
            <nav class="sidebar-menu">
                <!-- Usamos data-view para saber qué archivo HTML cargar -->
                <button class="nav-btn active" data-view="resumen">Dashboard</button>
                <button class="nav-btn" data-view="rutinas">Rutinas</button>
                <button class="nav-btn" data-view="notas">Notas</button>
                <button class="nav-btn" data-view="perfil">Perfil</button>
            </nav>
        </aside>

        <!-- Contenedor dinámico principal -->
        <main id="main-content" class="content-area">
            <!-- Aquí JS inyectará el contenido de las vistas -->
        </main>
    </div>

    <script src="js/dash.js"></script>
</body>
</html>
